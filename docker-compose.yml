
services:

  archivosprivados:
    build:
      context: .
      dockerfile: Dockerfile
    image: archivosprivados:0.0.1
    container_name: archivosprivados
    mem_limit: 128M
    mem_reservation: 64M
    env_file:
      - .env.production
    environment:
       NODE_ENV: "production"
       PORT: ${PORT:-2203}
    ports:
      - "127.0.0.1:2203:2203"
