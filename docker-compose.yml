
services:

  archivosprivados:
    build:
      context: .
      target: prod
    image: archivosprivados:0.0.1
    container_name: archivosprivados
    restart: unless-stopped
    mem_limit: 128M
    mem_reservation: 64M
    env_file:
      - .env.production
    volumes:
      - /var/log/trascender/archivosprivados:/srv/cf.archivosprivados/logs
    environment:
      NODE_ENV: "production"
      PORT: 2203
    ports:
      - "127.0.0.1:2203:2203"